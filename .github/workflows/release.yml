name: Automated GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Git tag (e.g. v1.0.0)"
        required: false
        type: string

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  release:
    name: Build & Publish Windows Release (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify Version Tag Alignment
        shell: powershell
        run: |
          $refName = "${{ github.ref_name }}"
          $inputTag = "${{ github.event.inputs.tag_name }}"
          $tag = if ($inputTag) { $inputTag } else { $refName }
          if ($tag -match "^v\d") {
            python scripts/generate_version.py --verify-tag $tag
          } else {
            python scripts/generate_version.py
          }

      - name: Bytecode Compilation Check
        run: |
          python -m compileall app tests scripts

      - name: Code Quality Checks (Ruff & Mypy)
        run: |
          ruff check .
          ruff format --check .
          mypy app/

      - name: Run Full Test Suite with Pytest
        run: |
          pytest -v --cov=app --cov-report=xml --cov-report=term tests/

      - name: Build Standalone Executable & Portable Archive
        run: |
          python scripts/build.py

      - name: Verify Standalone Executable Startup
        shell: powershell
        run: |
          $exePath = "dist\GDriveManager\GDriveManager.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Executable not found at $exePath"
            exit 1
          }
          Write-Host "[*] Testing $exePath --version..."
          & $exePath --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "[-] Executable failed with exit code $LASTEXITCODE"
            exit 1
          }
          Write-Host "[✓] Executable verified: started and executed cleanly."

      - name: Install Inno Setup Compiler
        shell: powershell
        run: |
          choco install innosetup --no-progress
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6") {
            echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
          }
          if (Test-Path "C:\Program Files\Inno Setup 6") {
            echo "C:\Program Files\Inno Setup 6" >> $env:GITHUB_PATH
          }

      - name: Compile Inno Setup Windows Installer
        run: |
          iscc packaging/windows/installer.iss

      - name: Verify Release Distribution Artifacts
        shell: powershell
        run: |
          $zipPath = "dist\GDriveManager-Windows-x64.zip"
          $setupPath = "dist\GDriveManager-Setup-x64.exe"
          if (-not (Test-Path $zipPath)) {
            Write-Error "[-] Missing release artifact: $zipPath"
            exit 1
          }
          if (-not (Test-Path $setupPath)) {
            Write-Error "[-] Missing release artifact: $setupPath"
            exit 1
          }
          Write-Host "[✓] Verified release artifacts:"
          Get-Item $zipPath, $setupPath | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize

      - name: Generate SHA256 Checksums
        shell: powershell
        run: |
          python scripts/generate_checksums.py
          Write-Host "Generated SHA256SUMS.txt:"
          Get-Content dist/SHA256SUMS.txt

      - name: Extract Release Notes from CHANGELOG.md
        shell: powershell
        run: |
          $refName = "${{ github.ref_name }}"
          $inputTag = "${{ github.event.inputs.tag_name }}"
          $tag = if ($inputTag) { $inputTag } else { $refName }
          python scripts/extract_release_notes.py $tag dist/RELEASE_NOTES.md
          Get-Content dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GDriveManager-Windows-x64.zip
            dist/GDriveManager-Setup-x64.exe
            dist/SHA256SUMS.txt
          body_path: dist/RELEASE_NOTES.md
          name: "GDrive Manager ${{ github.ref_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
