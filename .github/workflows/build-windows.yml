name: Build Windows Distribution

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Portable Package (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify Version Alignment
        run: |
          python scripts/generate_version.py

      - name: Generate Branding Assets
        run: |
          python scripts/generate_branding_assets.py

      - name: Build Standalone Executable & Portable Archive
        run: |
          python scripts/build.py

      - name: Verify Standalone Executable Startup
        shell: powershell
        run: |
          $exePath = "dist\GDriveManager\GDriveManager.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Executable not found at $exePath"
            exit 1
          }
          Write-Host "[*] Launching $exePath for runtime verification..."
          $p = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 3
          $running = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if ($running) {
            Stop-Process -Id $p.Id -Force
            Write-Host "[✓] Executable verified: started and executed cleanly (PID $($p.Id))"
          } else {
            Write-Error "[-] Executable exited prematurely with code $($p.ExitCode)"
            exit 1
          }

      - name: Upload Portable Windows Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDriveManager-Windows-x64
          path: dist/GDriveManager-Windows-x64.zip
          retention-days: 14
